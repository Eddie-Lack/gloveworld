name: Glover (North America)
sha1: 270be17b3c8da9b88a7b99c2a545b0bce16837f4
options:
  basename: NGVE
  target_path: baserom.us.z64
  elf_path: build/NGVE.elf
  base_path: .
  platform: n64
  compiler: GCC

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: bin
  ld_script_path: NGVE.ld
  ld_dependencies: False
  subalign: null
  o_as_suffix: True

  symbol_addrs_path:
    - symbol_addrs.txt
  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt

  find_file_boundaries: False
  section_order: [.rodata, .text, .data, .bss]
  migrate_rodata_to_functions: True

  generate_asm_macros_files: False
  asm_function_macro: glabel
  asm_data_macro: dlabel
  asm_jtbl_label_macro: jlabel
  asm_inc_header: |
    .include "macro.inc"
    .set noat
    .set noreorder
  generated_s_preamble: |
    .set gp=64
  header_encoding: ASCII
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  use_legacy_include_asm: False

segments:
  - name: header
    type: header
    start: 0x0

  - name: boot
    type: bin
    start: 0x40

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80100000
    subsegments:
      - [0x1000, hasm]

  - name: main
    type: code
    start: 0x1040
    vram: 0x80100040
    bss_size: 0xBB690
    subsegments:
      - [0x1040, rodata]
      - [0x10A0, .rodata, frontend]
